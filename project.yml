name: ProgressTracker
options:
  bundleIdPrefix: com.example          # à remplacer par le préfixe du développeur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ProgressTracker:
    type: application
    platform: iOS
    sources:
      - path: ProgressTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.progresstracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Progress Tracker"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

  ProgressTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProgressTrackerTests
    dependencies:
      - target: ProgressTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ProgressTracker:
    build:
      targets:
        ProgressTracker: all
        ProgressTrackerTests: [test]
    test:
      targets:
        - ProgressTrackerTests
